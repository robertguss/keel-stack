name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-skills.sh
      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/install-skills.sh
